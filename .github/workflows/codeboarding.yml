name: CodeBoarding review

on:
  pull_request:
    types: [opened, reopened, closed, synchronize]
  issue_comment:
    types: [created]

# No workflow-level permissions: each job requests only what it needs (least
# privilege), so the default token starts with none.
permissions: {}

concurrency:
  group: codeboarding-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read        # check out the repo + read the committed baseline (no writes in review mode)
      pull-requests: write  # post the architecture-diff PR comment
      issues: write         # the /codeboarding issue_comment trigger + comment API
      id-token: write       # mint a GitHub OIDC token for the free hosted tier (write is the only level for id-token)
      actions: read         # let a repeat review download the analysis an earlier run published, instead of re-deriving the whole PR
    if: >
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/codeboarding') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      # crate compiles with <maven.compiler.release>27. The Action then sets up JDK 21 for
      # JDT LS, which leaves JAVA_HOME_27_X64 set; Core registers it as a JDT LS runtime.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      # Test only: hands the Action the static analysis of 31875da from run 42617225914 (depth 2),
      # so a deeper review spends its time on the diagram instead of a second 2-hour static pass.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codeboarding-base-f788d14d7822cbed-31875da1c7019548960dac8fe857a5a66b855c19
          run-id: 42617225914
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cb-static-seed
      - uses: CodeBoarding/CodeBoarding-action@test/crate-java27
        with:
          depth_cap: '4'
          # A CodeBoarding license: the free hosted tier's weekly quota ran out on the JabRef forks.
          llm: license
          license_key: ${{ secrets.CODEBOARDING_LICENSE }}
